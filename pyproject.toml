[project]
name = "script-kinds"
version = "0.1.0"
description = "Fails a repository's check unless every script is dev tooling or a server script, by where it runs, with that kind's shebang."
requires-python = ">=3.13"
dependencies = ["cli-kit", "repo-settings", "git-default-branch"]

[project.scripts]
script-kinds = "script_kinds.__main__:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", tag = "v0.1.0" }
repo-settings = { git = "https://github.com/ianflanagan1/repo-settings", tag = "v0.1.0" }
git-default-branch = { git = "https://github.com/ianflanagan1/git-default-branch", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
